<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>CãoPanhia - Contato</title>
</head>

<body>

    <header>
        <h1>CãoPanhia</h1>
        <nav aria-label="Menu Principal">
            <ul class="nav-list">
                <li><a href="index.html">Início</a></li>
                <li><a href="servicos.html">Serviços</a></li>
                <li><a href="galeria.html">Galeria</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section>
            <h2>Entre em contato</h2>

            <form>

                <div class="form-field">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required minlength="3">
                </div>



                <div class="form-field">

                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu email" required>
                </div>


                <div class="form-field">
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" placeholder="Digite seu telefone" name="telefone">
                </div>




                <div class="form-field">
                    <label for="servico">Serviço:</label>
                    <select id="servico" name="servico">
                        <option value="banho">Banho</option>
                        <option value="tosa">Tosa</option>
                        <option value="banho-tosa">Banho e Tosa</option>
                    </select>
                </div>



                <fieldset>
                    <legend>Forma de contato:</legend>

                    <input type="radio" id="whatsapp" name="contato" value="whatsapp">
                    <label for="whatsapp">WhatsApp</label>

                    <input type="radio" id="telefone-contato" name="contato" value="telefone">
                    <label for="telefone-contato">Telefone</label>

                    <input type="radio" id="email-contato" name="contato" value="email">
                    <label for="email-contato">E-mail</label>
                </fieldset>


                <div class="form-field">
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" placeholder="Escreva sua mensagem aqui" rows="5"
                        cols="40"></textarea>
                </div>


                <button type="submit" class="botao">Enviar mensagem</button>

            </form>
        </section>

        <section>
            <h2>Informações de contato</h2>

            <p>E-mail: caopanhia@gmail.com</p>
            <p>Telefone: (51) 99999-9999</p>
            <p>Horário de atendimento: Segunda a sexta, das 9h às 18h.</p>
        </section>

        <section>
            <h2>Onde estamos</h2>

            <iframe src="https://www.google.com/maps?q=São+Sebastião+do+Caí,+RS&output=embed" width="600" height="450"
                title="Localização da CãoPanhia no Google Maps" loading="lazy">
            </iframe>
        </section>

    </main>

    <footer>
        <p>Desenvolvido por: <strong>Vitor</strong> e <strong>Cibely</strong></p>
    </footer>

</body>

</html>
